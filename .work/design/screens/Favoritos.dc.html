<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Catálogo — Meus favoritos</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#ececef;text-decoration:none}a:hover{color:#f2b84b}
a:focus-visible,button:focus-visible{outline:2px solid #f2b84b;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #121316; color: #ececef; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">
  <header style="border-bottom: 1px solid #2a2d34;">
    <nav style="max-width: 1200px; margin: 0 auto; padding: 16px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Main.dc.html" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #ececef;">Catálogo<span style="color: #f2b84b;">.</span></a>
      <div style="display: flex; gap: 8px; align-items: center;">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; color: #a3a6ad; font-weight: 500;">Explorar</a>
        <a href="Favoritos.dc.html" aria-current="page" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #1c1e23; color: #ececef; font-weight: 600;">Favoritos <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #2a2d34; color: #ececef; font-size: 12px; font-weight: 600;">{{favCount}}</span></a>
      </div>
    </nav>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; color: #ececef;">Meus favoritos</h1>
      <p style="margin: 0; color: #a3a6ad;">Os filmes salvos ficam neste navegador.</p>
    </div>

    <sc-if value="{{hasFavs}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px 20px;">
        <sc-for list="{{movies}}" as="m" hint-placeholder-count="3">
          <article style="display: flex; flex-direction: column; gap: 12px;">
            <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 12px; background: #23262c;">
              <a href="Detalhe.dc.html" aria-label="Ver detalhes de {{m.title}}" style="position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #6e727b; font-size: 12px;">Pôster</a>
              <button type="button" onClick="{{m.remove}}" aria-label="Remover {{m.title}} dos favoritos" style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: #15161a; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#f2b84b" stroke="#f2b84b" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.6 0 5.8 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></svg>
              </button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <a href="Detalhe.dc.html" style="font-weight: 600; font-size: 15px; color: #ececef;">{{m.title}}</a>
              <span style="font-size: 13px; color: #a3a6ad;">Nota [0,0] · [Ano]</span>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{noFavs}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 64px 24px; border-radius: 12px; border: 1px solid #2a2d34; background: #1c1e23; text-align: center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a3a6ad" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.6 0 5.8 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></svg>
        <p style="margin: 0; font-size: 16px; font-weight: 600; color: #ececef;">Você ainda não salvou nenhum filme.</p>
        <p style="margin: 0; color: #a3a6ad;">Toque no coração de um pôster para guardá-lo aqui.</p>
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 8px; background: #f2b84b; color: #121316; font-weight: 600;">Explorar filmes</a>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { favs: [2, 4, 7] };
  }
  renderVals() {
    var self = this;
    var favs = this.state.favs;
    var movies = favs.map(function (n) {
      return {
        title: '[Título do filme ' + n + ']',
        remove: function () {
          self.setState({ favs: self.state.favs.filter(function (x) { return x !== n; }) });
        }
      };
    });
    return { movies: movies, favCount: favs.length, hasFavs: favs.length > 0, noFavs: favs.length === 0 };
  }
}
</script>
</body>
</html>
