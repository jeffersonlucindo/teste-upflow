<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Catálogo — Filmes populares</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#ececef;text-decoration:none}a:hover{color:#f2b84b}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f2b84b;outline-offset:2px}
input::placeholder{color:#a3a6ad}
select{appearance:none;-webkit-appearance:none}
</style>
</helmet>
<div style="min-height: 100vh; background: #121316; color: #ececef; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">
  <header style="border-bottom: 1px solid #2a2d34;">
    <nav style="max-width: 1200px; margin: 0 auto; padding: 16px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Main.dc.html" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #ececef;">Catálogo<span style="color: #f2b84b;">.</span></a>
      <div style="display: flex; gap: 8px; align-items: center;">
        <a href="Main.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #1c1e23; color: #ececef; font-weight: 600;">Explorar</a>
        <a href="Favoritos.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; color: #a3a6ad; font-weight: 500;">Favoritos <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #2a2d34; color: #ececef; font-size: 12px; font-weight: 600;">{{favCount}}</span></a>
      </div>
    </nav>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 24px;">
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; color: #ececef;">Filmes populares</h1>

    <form role="search" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
      <label style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #a3a6ad;">Buscar por título
        <input type="search" placeholder="Digite o nome de um filme" style="height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #2a2d34; background: #1c1e23; color: #ececef; font: inherit; font-size: 14px; font-weight: 400;">
      </label>
      <label style="flex: 0 1 200px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #a3a6ad;">Gênero
        <span style="position: relative; display: block;">
          <select style="width: 100%; height: 44px; padding: 0 40px 0 16px; border-radius: 8px; border: 1px solid #2a2d34; background: #1c1e23; color: #ececef; font: inherit; font-size: 14px; font-weight: 500;">
            <option>Todos</option>
            <option>Ação</option>
            <option>Comédia</option>
            <option>Drama</option>
          </select>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a6ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 14px; pointer-events: none;"><path d="m6 9 6 6 6-6"></path></svg>
        </span>
      </label>
      <label style="flex: 0 1 200px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #a3a6ad;">Ordenar por
        <span style="position: relative; display: block;">
          <select style="width: 100%; height: 44px; padding: 0 40px 0 16px; border-radius: 8px; border: 1px solid #2a2d34; background: #1c1e23; color: #ececef; font: inherit; font-size: 14px; font-weight: 500;">
            <option>Popularidade</option>
            <option>Nota</option>
            <option>Data de lançamento</option>
          </select>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a6ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 14px; pointer-events: none;"><path d="m6 9 6 6 6-6"></path></svg>
        </span>
      </label>
    </form>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px 20px; margin-top: 8px;">
      <sc-for list="{{movies}}" as="m" hint-placeholder-count="8">
        <article style="display: flex; flex-direction: column; gap: 12px;">
          <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 12px; background: #23262c; display: flex; align-items: center; justify-content: center;">
            <a href="Detalhe.dc.html" aria-label="Ver detalhes de {{m.title}}" style="position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #6e727b; font-size: 12px;">Pôster</a>
            <button type="button" onClick="{{m.toggle}}" aria-pressed="{{m.fav}}" aria-label="{{m.favLabel}}" style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: #15161a; color: #ececef; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <sc-if value="{{m.fav}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#f2b84b" stroke="#f2b84b" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.6 0 5.8 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></svg>
              </sc-if>
              <sc-if value="{{m.notFav}}" hint-placeholder-val="{{true}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ececef" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.6 0 5.8 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></svg>
              </sc-if>
            </button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <a href="Detalhe.dc.html" style="font-weight: 600; font-size: 15px; color: #ececef;">{{m.title}}</a>
            <span style="font-size: 13px; color: #a3a6ad;">Nota [0,0] · [Ano]</span>
          </div>
        </article>
      </sc-for>
    </div>

    <nav aria-label="Paginação" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; margin-top: 16px;">
      <button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #3a3e47; background: #121316; color: #ececef; font: inherit; font-weight: 600; cursor: pointer;">Anterior</button>
      <span style="color: #a3a6ad;">Página 1 de [N]</span>
      <button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #f2b84b; color: #121316; font: inherit; font-weight: 600; cursor: pointer;">Próxima</button>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { favs: [2] };
  }
  renderVals() {
    var favs = this.state.favs;
    var self = this;
    var movies = [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) {
      var fav = favs.indexOf(n) !== -1;
      return {
        title: '[Título do filme ' + n + ']',
        fav: fav,
        notFav: !fav,
        favLabel: fav ? 'Remover dos favoritos' : 'Adicionar aos favoritos',
        toggle: function () {
          var cur = self.state.favs;
          self.setState({ favs: cur.indexOf(n) !== -1 ? cur.filter(function (x) { return x !== n; }) : cur.concat([n]) });
        }
      };
    });
    return { movies: movies, favCount: favs.length };
  }
}
</script>
</body>
</html>
